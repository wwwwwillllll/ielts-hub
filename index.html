<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>整合工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1e;--card:#1a1a2e;--card2:#16213e;--border:#2a2a4a;
  --primary:#0e9bff;--accent:#00e5ff;--text:#e8e8f0;--text-light:#8888a8;
  --learn:#0e9bff;--life:#ff6b9d;
  --ielts:#ff6b9d;--book:#4facfe;--creator:#fbbf24;--podcast:#a78bfa;--finance:#10b981;--code:#f97316;--piano:#ec4899;
  --goods:#ff8e53;--recipe:#f59e0b;--money:#84cc16;--sport:#06b6d4;--travel:#8b5cf6;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100vh;display:flex;flex-direction:column}
.statusbar{height:var(--safe-t);background:var(--card2)}
.header{background:linear-gradient(135deg,var(--card2),var(--bg));padding:12px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-size:1.1em;font-weight:700}.brand .a{color:var(--accent)}
.tab-switch{display:flex;background:rgba(255,255,255,0.06);border-radius:20px;padding:3px}
.tab-switch button{background:transparent;border:none;color:var(--text-light);font-size:.78em;padding:6px 14px;border-radius:18px;cursor:pointer;transition:all .2s}
.tab-switch button.active{background:var(--primary);color:#fff}
.header-info{display:flex;gap:12px;font-size:.72em;color:var(--text-light);flex-wrap:wrap}
.header-info span{display:flex;align-items:center;gap:3px}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(80px + var(--safe-b))}
.page{display:none}.page.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-title{font-size:.84em;font-weight:600;color:var(--text-light);margin:14px 4px 8px;display:flex;align-items:center;gap:6px}
.section-title:first-child{margin-top:0}

/* 首页月历 */
.calendar{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--border);margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal-grid .hd{text-align:center;font-size:.66em;color:var(--text-light);padding:3px 0}
.cal-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7em;background:rgba(255,255,255,0.03);position:relative}
.cal-cell.empty{background:transparent}
.cal-cell.today{box-shadow:0 0 0 2px var(--accent)}
.cal-cell .d{color:var(--text)}
.cal-cell .dot{width:4px;height:4px;border-radius:50%;margin-top:1px}
.cal-cell.done .dot{background:var(--sport)}
.cal-cell.partial .dot{background:var(--write)}
.cal-cell.none .dot{background:transparent}

/* 计时器 */
.timer-card{background:linear-gradient(135deg,var(--card2),var(--card));border-radius:14px;padding:16px;border:1px solid var(--border);margin-bottom:12px;text-align:center}
.timer-display{font-size:2.4em;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-label{font-size:.72em;color:var(--text-light);margin-top:2px}
.timer-btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.timer-btn{background:var(--primary);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:.8em;cursor:pointer}
.timer-btn.stop{background:rgba(255,255,255,0.1)}
.timer-today{font-size:.74em;color:var(--text-light);margin-top:8px}

/* TODO */
.todo-item{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);display:flex;align-items:center;gap:10px;border-left:3px solid var(--text-light)}
.todo-item.done{opacity:.5}
.todo-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7em;color:transparent;cursor:pointer;transition:all .2s}
.todo-item.done .todo-check{background:var(--sport);border-color:var(--sport);color:#fff}
.todo-text{flex:1;font-size:.84em}
.todo-text .todo-src{font-size:.66em;color:var(--text-light)}
.todo-time{font-size:.66em;color:var(--text-light);background:rgba(255,255,255,0.04);padding:2px 6px;border-radius:6px}
.empty{text-align:center;padding:24px;color:var(--text-light);font-size:.86em}

/* 通用模块样式 */
.module{display:none}
.module.active{display:block;animation:fadeIn .25s}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-head .ci{font-size:1.2em}
.card-head .ct{flex:1;font-size:.9em;font-weight:600}
.btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-size:.82em;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,0.06);color:var(--text)}
input,textarea,select{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-size:.84em;width:100%;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:60px}
label{font-size:.74em;color:var(--text-light);display:block;margin-bottom:4px}
.form-row{margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* 视频卡片 */
.v-card{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:10px;border:1px solid var(--border)}
.v-card.pick{border:2px solid var(--primary);box-shadow:0 4px 16px rgba(14,155,255,.25)}
.v-head{display:flex;align-items:center;padding:10px 12px;gap:8px}
.v-num{width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:.68em;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.v-title{flex:1;font-size:.82em;font-weight:600;line-height:1.4}
.v-tag{font-size:.62em;color:var(--text-light);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:6px;flex-shrink:0}
.v-wrap{position:relative;width:100%;padding-top:56.25%;background:#000}
.v-ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--card2),var(--bg));cursor:pointer;gap:6px}
.v-play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:1.2em;color:#333}
.v-pt{font-size:.74em;opacity:.9}

/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,30,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-b);z-index:100}
.tab{flex:1;padding:7px 0 9px;text-align:center;cursor:pointer;color:var(--text-light);transition:color .2s}
.tab.active{color:var(--accent)}
.tab .ti{font-size:1.15em}.tab .tl{font-size:.6em;margin-top:1px}

/* 模块导航抽屉 */
.modals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mod-item{background:var(--card);border-radius:12px;padding:14px 10px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.mod-item:active{transform:scale(.97)}
.mod-item .mi{font-size:1.6em}
.mod-item .mn{font-size:.74em;margin-top:4px}
.mod-item .md{font-size:.62em;color:var(--text-light);margin-top:2px}

/* 进度条 */
.prog-item{margin-bottom:10px}
.prog-head{display:flex;justify-content:space-between;font-size:.78em;margin-bottom:4px}
.prog-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s}

/* 标签 */
.tag{display:inline-block;font-size:.66em;padding:2px 8px;border-radius:8px;margin:2px}
.tag.sel{background:var(--primary);color:#fff}
.tag.unsel{background:rgba(255,255,255,.05);color:var(--text-light)}
.filter-bar{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin-bottom:10px;flex-wrap:wrap}
.filter-bar::-webkit-scrollbar{display:none}

/* 列表项 */
.list-item{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);display:flex;gap:10px;align-items:center}
.list-item:active{background:rgba(255,255,255,.02)}
.li-icon{font-size:1.3em}
.li-info{flex:1;min-width:0}
.li-title{font-size:.84em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-desc{font-size:.68em;color:var(--text-light);margin-top:2px}
.li-arrow{color:var(--text-light)}
.li-status{font-size:.62em;padding:2px 8px;border-radius:8px;flex-shrink:0}
.li-status.want{background:rgba(167,139,250,.2);color:var(--podcast)}
.li-status.doing{background:rgba(14,155,255,.2);color:var(--primary)}
.li-status.done{background:rgba(16,185,129,.2);color:var(--finance)}

/* 弹窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:none;overflow-y:auto}
.modal.show{display:block}
.modal-content{background:var(--card);margin:20px;border-radius:16px;padding:20px;max-width:500px;margin-left:auto;margin-right:auto}
.modal-close{float:right;font-size:1.4em;cursor:pointer;color:var(--text-light)}
</style>
</head>
<body>
<div id="app">
  <div class="statusbar"></div>
  <div class="header">
    <div class="header-top">
      <div class="brand">整合<span class="a">工作台</span></div>
      <div class="tab-switch">
        <button id="btn-life" class="active" onclick="switchTab('life')">🏠 生活台</button>
        <button id="btn-learn" onclick="switchTab('learn')">📚 学习台</button>
      </div>
    </div>
    <div class="header-info">
      <span id="hdrDate">--</span>
      <span id="hdrWeek">--</span>
      <span id="hdrTimer">⏱️ 今日 0h</span>
    </div>
  </div>

  <div class="content">
    <!-- 首页 -->
    <div class="page active" id="page-home">
      <!-- 月历 -->
      <div class="calendar" id="calendar"></div>
      <!-- 计时器 -->
      <div class="timer-card" id="timerCard">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div class="timer-label">学习计时</div>
        <div class="timer-btns">
          <button class="timer-btn" id="timerStart" onclick="timerToggle()">▶ 开始</button>
          <button class="timer-btn ghost" onclick="timerReset()">↺ 重置</button>
        </div>
        <div class="timer-today" id="timerToday">今日累计：0 分钟</div>
      </div>
      <!-- 今日TODO -->
      <div class="section-title">📝 今日 TODO List</div>
      <div id="todayTodo"></div>
    </div>

    <!-- 模块容器：生活台 -->
    <div class="page" id="page-life">
      <div class="section-title" style="margin-top:0">🏠 生活台模块</div>
      <div class="modals" id="lifeMods"></div>
    </div>

    <!-- 模块容器：学习台 -->
    <div class="page" id="page-learn">
      <div class="section-title" style="margin-top:0">📚 学习台模块</div>
      <div class="modals" id="learnMods"></div>
    </div>

    <!-- 各模块详情页（动态填充） -->
    <div class="page" id="page-mod"></div>
  </div>

  <div class="tabbar">
    <div class="tab active" data-page="home" onclick="navPage('home')"><div class="ti">●</div><div class="tl">首页</div></div>
    <div class="tab" data-page="life" onclick="navPage('life')" id="tab-life"><div class="ti">🏠</div><div class="tl">生活台</div></div>
    <div class="tab" data-page="learn" onclick="navPage('learn')" id="tab-learn"><div class="ti">📚</div><div class="tl">学习台</div></div>
    <div class="tab" data-page="mod" onclick="navPage('mod')" id="tab-mod" style="display:none"><div class="ti">▣</div><div class="tl">模块</div></div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
// ==================== 基础工具 ====================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function dateKey(d){const x=new Date(d);return `${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`}
function todayKey(){return dateKey(new Date())}
function getStore(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}
function setStore(k,v){localStorage.setItem(k,JSON.stringify(v))}
const today=new Date();today.setHours(0,0,0,0);
const wd=['日','一','二','三','四','五','六'];

// ==================== 模块定义 ====================
const LIFE_MODS=[
  {id:'goods',icon:'🛍️',name:'好物收藏',desc:'吃/用/穿',color:'var(--goods)'},
  {id:'recipe',icon:'🍳',name:'菜谱提取器',desc:'材料克重+热量',color:'var(--recipe)'},
  {id:'money',icon:'💰',name:'记账',desc:'分类+预算+报表',color:'var(--money)'},
  {id:'sport',icon:'🏃',name:'运动打卡',desc:'每日打卡',color:'var(--sport)'},
  {id:'travel',icon:'✈️',name:'旅行攻略',desc:'按目的地划分',color:'var(--travel)'},
];
const LEARN_MODS=[
  {id:'ielts',icon:'📖',name:'雅思学习',desc:'7功能区',color:'var(--ielts)'},
  {id:'book',icon:'📚',name:'读书笔记',desc:'荐书+笔记',color:'var(--book)'},
  {id:'creator',icon:'🎬',name:'内容创作',desc:'选题/剪辑/脚本',color:'var(--creator)'},
  {id:'podcast',icon:'🎙️',name:'播客笔记',desc:'热度推荐+笔记',color:'var(--podcast)'},
  {id:'finance',icon:'💰',name:'理财学习',desc:'知识+行情+定投',color:'var(--finance)'},
  {id:'code',icon:'💻',name:'编程学习',desc:'Excel/SQL/Python',color:'var(--code)'},
  {id:'piano',icon:'🎹',name:'钢琴学习',desc:'视频+打卡+曲目',color:'var(--piano)'},
];
let currentTab='life';
let currentMod=null;

// ==================== 头部 ====================
$('#hdrDate').textContent=`${today.getMonth()+1}月${today.getDate()}日`;
$('#hdrWeek').textContent=`周${wd[today.getDay()]}`;

function switchTab(tab){
  currentTab=tab;
  $('#btn-life').classList.toggle('active',tab==='life');
  $('#btn-learn').classList.toggle('active',tab==='learn');
  navPage(tab==='life'?'life':'learn');
}

function navPage(p){
  $$('.page').forEach(x=>x.classList.remove('active'));
  $('#page-'+p).classList.add('active');
  $$('.tab').forEach(x=>x.classList.remove('active'));
  const tab=$(`.tab[data-page="${p}"]`);
  if(tab)tab.classList.add('active');
  if(p==='life'){renderMods('life');switchTabBtn('life')}
  if(p==='learn'){renderMods('learn');switchTabBtn('learn')}
  if(p==='home'){renderHome();switchTabBtn('life')}
  $('.content').scrollTop=0;
}
function switchTabBtn(t){
  $('#btn-life').classList.toggle('active',t==='life');
  $('#btn-learn').classList.toggle('active',t==='learn');
}

// ==================== 首页 ====================
function renderHome(){
  renderCalendar();
  renderTodayTodo();
  updateTimerDisplay();
}

// 月历
function renderCalendar(){
  const cal=$('#calendar');
  const y=today.getFullYear(),m=today.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  let html=`<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.9em;font-weight:600">${y}年${m+1}月</span><span style="font-size:.7em;color:var(--text-light)">●已完成 ○部分 ✕未做</span></div>`;
  html+='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="hd">${d}</div>`);
  for(let i=0;i<first.getDay();i++)html+='<div class="cal-cell empty"></div>';
  const records=getStore('hub_records',{});
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(y,m,d);dt.setHours(0,0,0,0);
    const key=dateKey(dt);
    const r=records[key];
    let cls='cal-cell';
    if(dt.getTime()===today.getTime())cls+=' today';
    if(r){
      const total=r.total||0,done=r.done||0;
      if(done>0&&done>=total)cls+=' done';
      else if(done>0)cls+=' partial';
      else cls+=' none';
    }else cls+=' none';
    html+=`<div class="${cls}"><div class="d">${d}</div><div class="dot"></div></div>`;
  }
  html+='</div>';
  cal.innerHTML=html;
}

// 今日TODO（聚合各模块任务）
function getTodayTasks(){
  // 简化版：从各模块生成今日任务
  const tasks=[];
  const records=getStore('hub_records',{});
  const todayR=records[todayKey()]||(records[todayKey()]={tasks:{}});
  
  // 雅思任务（每天）
  tasks.push({id:'ielts',icon:'📖',src:'雅思',text:'完成今日雅思学习任务',time:'60min',done:!!todayR.tasks.ielts});
  // 读书
  tasks.push({id:'book',icon:'📚',src:'读书',text:'阅读今日推荐书籍',time:'30min',done:!!todayR.tasks.book});
  // 运动
  tasks.push({id:'sport',icon:'🏃',src:'运动',text:'完成今日运动打卡',time:'30min',done:!!todayR.tasks.sport});
  // 记账
  tasks.push({id:'money',icon:'💰',src:'记账',text:'记录今日开销',time:'5min',done:!!todayR.tasks.money});
  // 理财小课堂
  tasks.push({id:'finance',icon:'💰',src:'理财',text:'学习每日理财小课堂',time:'15min',done:!!todayR.tasks.finance});
  return tasks;
}

function renderTodayTodo(){
  const c=$('#todayTodo');
  const tasks=getTodayTasks();
  if(tasks.length===0){c.innerHTML='<div class="empty">今日暂无任务</div>';return}
  c.innerHTML=tasks.map(t=>`
    <div class="todo-item ${t.done?'done':''}" onclick="toggleTodo('${t.id}')">
      <div class="todo-check">✓</div>
      <div class="todo-text">${t.text}<div class="todo-src">来自：${t.src}</div></div>
      <div class="todo-time">${t.time}</div>
    </div>
  `).join('');
}

function toggleTodo(id){
  const r=getStore('hub_records',{});
  const k=todayKey();
  if(!r[k])r[k]={tasks:{}};
  r[k].tasks[id]=!r[k].tasks[id];
  // 更新统计
  const tasks=r[k].tasks;
  r[k].done=Object.values(tasks).filter(Boolean).length;
  r[k].total=Object.keys(tasks).length;
  setStore('hub_records',r);
  renderTodayTodo();
  renderCalendar();
}

// ==================== 计时器 ====================
let timerStart2=null,timerElapsed=0,timerRunning=false;
function timerToggle(){
  if(timerRunning){
    clearInterval(timerStart2);
    timerRunning=false;
    $('#timerStart').textContent='▶ 继续';
    // 保存今日时长
    const r=getStore('hub_timer',{});
    const k=todayKey();
    r[k]=(r[k]||0)+timerElapsed;
    setStore('hub_timer',r);
    timerElapsed=0;
  }else{
    timerRunning=true;
    const start=Date.now();
    timerStart2=setInterval(()=>{
      const r=getStore('hub_timer',{});
      const k=todayKey();
      const todaySec=r[k]||0;
      const total=todaySec+(Date.now()-start);
      updateTimerDisplay(total);
    },1000);
    $('#timerStart').textContent='⏸ 暂停';
  }
  updateTodayTimerLabel();
}
function timerReset(){
  clearInterval(timerStart2);
  timerRunning=false;
  timerElapsed=0;
  $('#timerStart').textContent='▶ 开始';
  updateTimerDisplay(0);
}
function updateTimerDisplay(sec){
  sec=sec||0;
  const h=String(Math.floor(sec/3600)).padStart(2,'0');
  const m=String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');

function classifyGoods(text){
  const scores={eat:0,use:0,wear:0};
  for(const cat in GOODS_KEYWORDS){
    for(const kw of GOODS_KEYWORDS[cat]){
      if(text.includes(kw))scores[cat]++;
    }
  }
  let best='use',max=0;
  for(const cat in scores){if(scores[cat]>max){max=scores[cat];best=cat}}
  return {cat:best,scores};
}
function extractShop(text){
  // 1. 先找品牌名（返回品牌+官方旗舰店）
  for(const brand of BRAND_NAMES){
    if(text.toLowerCase().includes(brand.toLowerCase()))return brand+'官方旗舰店';
  }
  // 2. 找各种店铺后缀模式（旗舰店/专卖/的店/工作室/专属等）
  const SHOP_SUFFIXES=['旗舰店','专卖店','官方店','品牌店','专营店','直营店','海外店','的店','工作室','专属','授权店','自营店','特约店','代理店','折扣店','工厂店','企业店','旗舰','专卖'];
  for(const kw of SHOP_SUFFIXES){
    const idx=text.indexOf(kw);
    if(idx>=0){
      let start=idx;
      while(start>0&&!/[：:，,。、\s（）()]/.test(text[start-1])&&idx-start<10)start--;
      const shopName=text.slice(start,idx+kw.length);
      if(shopName.length>=3)return shopName;
    }
  }
  // 3. 找"店铺：xxx"或"来自xxx"模式
  const m1=text.match(/(?:店铺|来自|推荐|购买)[：:]\s*([^\s，,。、\n]{2,15})/);
  if(m1)return m1[1];
  // 4. 找"在xxx买"模式
  const m2=text.match(/在\s*([^\s，,。、\n]{2,10})\s*(?:买|购买|入手)/);
  if(m2)return m2[1];
  // 5. 找"xxx同款"模式（说明是某个博主/明星推荐）
  const m3=text.match(/([^\s，,。、\n]{2,8})\s*同款/);
  if(m3)return m3[1]+'推荐';
  return '';
}
function detectSeason(text){
  for(const s in SEASON_KEYWORDS){
    for(const kw of SEASON_KEYWORDS[s]){
      if(text.includes(kw))return s;
    }
  }
  return '';
}
function extractLinks(text){
  const urls=[];
  // 匹配各种链接
  const m1=text.match(/https?:\/\/[^\s，。、""''<>\n\r）)]+/gi);
  if(m1)urls.push(...m1);
  // 匹配淘口令/分享文案里的链接
  const m2=text.match(/[a-zA-Z0-9]{10,}\/[a-zA-Z0-9]{5,}/g);
  if(m2)urls.push(...m2.map(s=>'https://'+s));
  return [...new Set(urls)];
}
function extractPrice(text){
  const m=text.match(/[¥￥]\s*(\d+(?:\.\d{1,2})?)/);
  if(m)return m[1];
  const m2=text.match(/(\d+(?:\.\d{1,2})?)\s*元/);
  if(m2)return m2[1];
  const m3=text.match(/价格\s*(\d+(?:\.\d{1,2})?)/);
  if(m3)return m3[1];
  return '';
}

async function fetchGoodsLink(url){
  const PROXIES=[
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  ];
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{signal:AbortSignal.timeout(8000)});
      if(!r.ok)continue;
      const html=await r.text();
      if(html.length<200)continue;
      // 提取 title
      let title='';
      const tm=html.match(/<title[^>]*>([^<]+)<\/title>/i);
      if(tm)title=tm[1].trim();
      // 提取 og:title
      const ogtm=html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i);
      if(ogtm)title=ogtm[1].trim();
      // 提取价格
      let price='';
      const pm=html.match(/[¥￥]\s*(\d+(?:\.\d{1,2})?)/);
      if(pm)price=pm[1];
      if(!price){
        const pm2=html.match(/price['"]?\s*[:=]\s*['"]?(\d+(?:\.\d{1,2})?)/i);
        if(pm2)price=pm2[1];
      }
      if(title&&title!=='302 Found'&&title.length>4){
        return {title,price,raw:html};
      }
    }catch(e){continue}
  }
  return null;
}
async function runSmartGoods(){
  const text=$('#sg-text').value.trim();
  const linksText=$('#sg-links').value.trim();
  const links=linksText?linksText.split('\n').map(s=>s.trim()).filter(Boolean):[];
  if(!text&&links.length===0){alert('请粘贴文案或填写商品链接');return}

  const items=getStore('hub_goods',[]);
  let added=0;
  let failedLinks=0;
  // 1. 先处理粘贴的文案
  if(text){
    statusEl.textContent='正在识别文案...';
    const blocks=[];
    let cur='';
    for(const line of text.split('\n')){
      cur+=line+'\n';
      if(/https?:\/\//.test(line)||line.trim()===''){
        if(cur.trim())blocks.push(cur.trim());
        cur='';
      }
    }
    if(cur.trim())blocks.push(cur.trim());
    if(blocks.length===0)blocks.push(text);
    for(const block of blocks){
      if(block.length<4)continue;
      const {cat}=classifyGoods(block);
      const season=cat==='wear'?detectSeason(block):'';
      const linkUrls=extractLinks(block);
      const price=extractPrice(block);
      const shop=extractShop(block);
      let name=block.split('\n')[0].replace(/https?:\/\/[^\s]+/gi,'').replace(/[¥￥]\s*\d+(?:\.\d{1,2})?/g,'').replace(/\d+(?:\.\d{1,2})?\s*元/g,'').trim();
      if(name.length>30)name=name.slice(0,30);
      if(name.length<2){
        const lines=block.split('\n').filter(x=>x.trim());
        name=(lines[1]||block).replace(/https?:\/\/[^\s]+/gi,'').trim().slice(0,20);
      }
      let note=block.split('\n').slice(1).join(' ').replace(/https?:\/\/[^\s]+/gi,'').replace(/[¥￥]\s*\d+(?:\.\d{1,2})?/g,'').trim();
      if(note.length>200)note=note.slice(0,200);
      if(name&&name.length>=2){
        items.unshift({name,cat,season,link:linkUrls[0]||'',shop,price,note});
        added++;
      }
    }
  }
  // 2. 再处理商品链接（异步抓取）
  for(let i=0;i<links.length;i++){
    statusEl.textContent=`正在抓取商品链接 ${i+1}/${links.length}...`;
    const r=await fetchGoodsLink(links[i]);
    if(!r){failedLinks++;continue}
    const fullText=r.title+(r.price?(' ¥'+r.price):'');
    const {cat}=classifyGoods(fullText);
    const season=cat==='wear'?detectSeason(fullText):'';
    const shop=extractShop(r.raw||'');
    items.unshift({
      name:r.title.slice(0,40),
      cat,
      season,
      link:links[i],
      shop,
      price:r.price||'',
      note:'（链接自动抓取）',
    });
    added++;
  }
  setStore('hub_goods',items);
  let msg=`✅ 识别完成！新增 ${added} 个好物`;
  if(failedLinks>0)msg+=`（${failedLinks}个链接抓取失败，请手动粘贴文案）`;
  statusEl.textContent=msg;
  setTimeout(()=>{closeModal();renderMod('goods')},1200);
}

const TRAVEL_KEYWORDS={
  scenery:['景点','门票','开放','游览','参观','打卡','公园','寺','塔','博物馆','景区','广场','教堂','宫殿','城堡','湖','山','海滩','瀑布','观景','缆车','索道','游船','展览','地标','名胜','古迹','遗址','植物园','动物园','夜市','步行街','老街','古镇','稻荷','鸟居','岚山','清水','展望台','舞台','打卡点'],
  food:['美食','餐厅','好吃','推荐','小吃','特色','必吃','当地','菜','面','饭','烤','火锅','甜品','咖啡','奶茶','早餐','午餐','晚餐','宵夜','市场','食堂','馆','店','糕','饼','汤','串','烧烤','日料','韩餐','西餐','中餐','拉面','玉子','抹茶','冰淇淋','小路'],
  stay:['住宿','酒店','民宿','青旅','客栈','宾馆','套房','标间','大床','双床','一晚','房价','check','入住','退房','泳池','健身房','均价','性价比','/晚','元/晚'],
  transport:['地铁','公交','打车','Uber','滴滴','机场','高铁','火车','飞机','巴士','地铁线','号线','换乘','时刻表','租车','自驾','停车','接驳','专线','轮渡','JR','特急','haruka','新干线','票务','巴士一日券','交通券','交通卡','一日券','周游券','关西机场','到京都站','内交通'],
};
function classifyLine(line){
  const scores={scenery:0,food:0,stay:0,transport:0,notes:0};
  for(const cat in TRAVEL_KEYWORDS){
    for(const kw of TRAVEL_KEYWORDS[cat]){
      if(line.includes(kw))scores[cat]++;
    }
  }
  let best='notes',max=0;
  for(const cat in scores){if(scores[cat]>max){max=scores[cat];best=cat}}
  return max===0?'notes':best;
}
function runSmartExtract(i){
  const rawText=$('#se-text').value.trim();
  const links=$('#se-link').value.trim().split('\n').map(s=>s.trim()).filter(Boolean);
  const hint=$('#se-hint').value.trim();
  if(!rawText&&links.length===0){alert('请粘贴攻略文本或填写链接');return}
  const statusEl=$('#se-status');
  const t=getStore('hub_travel',[]);
  // 合并已有内容（保留用户已编辑的）
  const tt=getStore('hub_travel',[]);
  const existing=tt[i];
  const merged={
    scenery:existing.scenery||[],
    food:existing.food||[],
    stay:existing.stay||[],
    transport:existing.transport||[],
    notes:(existing.notes&&existing.notes.length>0)?existing.notes.split('\n'):[],
  };
  const PROXIES=[
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  ];
  async function fetchOne(url){
    for(const p of PROXIES){
      try{
        const r=await fetch(p(url),{signal:AbortSignal.timeout(10000)});
        if(!r.ok)continue;
        const txt=await r.text();
        if(txt&&txt.length>200)return txt;
      }catch(e){continue}
    }
    return '';
  }
  function parseHTML(html){
    let title='';
    const tm=html.match(/<title[^>]*>([^<]+)<\/title>/i);
    if(tm)title=tm[1].trim();
    let desc='';
    const dm=html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i);
    if(dm)desc=dm[1].trim();
    const odm=html.match(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i);
    if(odm&&!desc)desc=odm[1].trim();
    let body=html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,'\n');
    body=body.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    const lines=body.split('\n').map(s=>s.trim()).filter(s=>s.length>4);
    return {title,desc,lines};
  }
  function processText(text){
    // 按换行/句号/分号拆分
    const lines=text.split(/[\n。；;]/).map(s=>s.trim()).filter(s=>s.length>4&&s.length<300);
    for(const line of lines){
      const cat=classifyLine(line);
      if(!merged[cat].includes(line))merged[cat].push(line);
    }
  }
  async function processAll(){
    // 1. 先处理粘贴的文本
    if(rawText){
      statusEl.textContent='正在分类整理文本...';
      processText(rawText);
    }
    // 2. 再处理链接
    for(let li=0;li<links.length;li++){
      statusEl.textContent=`正在抓取第 ${li+1}/${links.length} 个链接...`;
      const html=await fetchOne(links[li]);
      if(!html){statusEl.textContent=`⚠️ 第${li+1}个链接抓取失败（平台反爬），跳过`;await new Promise(r=>setTimeout(r,600));continue}
      const {title,desc,lines}=parseHTML(html);
      if(title)merged.notes.push(`【来源${li+1}】${title}`);
      if(desc)merged.notes.push(desc);
      for(const line of lines){
        if(line.length<6||line.length>200)continue;
        const cat=classifyLine(line);
        if(!merged[cat].includes(line))merged[cat].push(line);
      }
    }
    // 限制每个分类最多 40 条
    for(const c in merged){merged[c]=merged[c].slice(0,40)}
    if(hint)merged.notes.unshift(`📌 ${hint}`);
    // 写入记录
    const ttt=getStore('hub_travel',[]);
    ttt[i].scenery=merged.scenery;
    ttt[i].food=merged.food;
    ttt[i].stay=merged.stay;
    ttt[i].transport=merged.transport;
    ttt[i].notes=merged.notes.join('\n');
    ttt[i].rawText=rawText;
    ttt[i].link=links.join('\n');
    ttt[i].lastExtract=new Date().toLocaleString('zh-CN');
    setStore('hub_travel',ttt);
    statusEl.textContent='✅ 提取完成！正在打开编辑...';
    await new Promise(r=>setTimeout(r,600));
    closeModal();
    viewTravel(i);
  }
  processAll().catch(e=>{
    statusEl.textContent='❌ 提取失败：'+e.message;
  });
}

function detectPodcastPlatform(url){
  if(/xiaoyuzhoufm\.com/.test(url))return {id:'xiaoyuzhou',name:'小宇宙'};
  if(/podcasts\.apple\.com|itunes\.apple\.com/.test(url))return {id:'apple',name:'Apple Podcasts'};
  if(/music\.163\.com/.test(url))return {id:'netease',name:'网易云'};
  if(/ximalaya\.com/.test(url))return {id:'ximalaya',name:'喜马拉雅'};
  if(/bilibili\.com/.test(url))return {id:'bili',name:'B站'};
  if(/youtube\.com|youtu\.be/.test(url))return {id:'youtube',name:'YouTube'};
  return {id:'other',name:'其他平台'};
}
async function fetchPodcastInfo(url){
  const plat=detectPodcastPlatform(url);
  const PROXIES=[
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  ];
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const html=await r.text();
      if(html.length<200)continue;
      let title='',host='',desc='';
      // og:title
      const ogt=html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i);
      if(ogt)title=ogt[1].trim();
      if(!title){
        const tm=html.match(/<title[^>]*>([^<]+)<\/title>/i);
        if(tm)title=tm[1].trim();
      }
      // og:description
      const ogd=html.match(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i);
      if(ogd)desc=ogd[1].trim();
      // 小宇宙特殊：主播名常在标题或描述里
      const hm=html.match(/主播[：:]\s*([^\s，,。\n]{2,15})/);
      if(hm)host=hm[1];
      // 通用：从 title 里分离 "节目名 - 主播" 或 "主播：节目"
      if(!host){
        const parts=title.split(/[-—|·]/);
        if(parts.length>=2){
          // 短的可能是主播名
          const candidate=parts[parts.length-1].trim();
          if(candidate.length>=2&&candidate.length<=10)host=candidate;
        }
      }
      if(title&&title!=='302 Found'&&title.length>3){
        // 清理标题里的平台后缀
        title=title.replace(/\s*[-–—]\s*(小宇宙|Apple Podcasts|网易云音乐|喜马拉雅|哔哩哔哩|bilibili)\s*$/i,'');
        return {title,host,desc,platName:plat.name,raw:html};
      }
    }catch(e){continue}
  }
  return null;
}
async function runSmartPodcast(){
  const linksText=$('#sp-links').value.trim();
  const links=linksText?linksText.split('\n').map(s=>s.trim()).filter(Boolean):[];
  if(links.length===0){alert('请粘贴播客链接');return}
  const statusEl=$('#sp-status');
  const todos=getStore('hub_podcast_todo',[]);
  let added=0,failed=0;
  for(let i=0;i<links.length;i++){
    statusEl.textContent=`正在识别 ${i+1}/${links.length}...`;
    const url=links[i];
    const plat=detectPodcastPlatform(url);
    const info=await fetchPodcastInfo(url);
    if(info){
      // 去重
      if(todos.some(t=>t.link===url)){
        statusEl.textContent=`⚠️ 第${i+1}个已存在，跳过`;
        await new Promise(r=>setTimeout(r,600));
        continue;
      }
      todos.unshift({
        title:info.title,
        host:info.host||'',
        link:url,
        plat:plat.id,
        platName:plat.name,
        desc:info.desc||'',
        duration:'',
        addedAt:new Date().toLocaleString('zh-CN'),
        status:'todo',
      });
      added++;
    }else{
      // 抓取失败，仍添加（用 URL 作为标题占位）
      todos.unshift({
        title:'（点击编辑改名）'+url.slice(-20),
        host:'',
        link:url,
        plat:plat.id,
        platName:plat.name,
        desc:'自动抓取失败，请手动编辑补充信息',
        duration:'',
        addedAt:new Date().toLocaleString('zh-CN'),
        status:'todo',
      });
      failed++;
      added++;
    }
  }
  setStore('hub_podcast_todo',todos);
  let msg=`✅ 识别完成！新增 ${added} 个待听`;
  if(failed>0)msg+=`（${failed}个需手动补充标题）`;
  statusEl.textContent=msg;
  setTimeout(()=>{closeModal();renderMod('podcast')},1200);
}

      <div style="font-size:1.8em;font-weight:700;color:var(--piano)">${practice.length}次</div>
      <div style="font-size:.72em;color:var(--text-light)">${totalMin} 分钟 · ${pieces.length} 首曲目</div>
    </div>
    <button class="btn" style="width:100%;margin-bottom:10px" onclick="addPiano()">➕ 今日练习打卡</button>
    <div class="section-title">📹 视频教程</div>
    ${PIANO_VIDEOS.map(v=>videoCard(v.bv,v.t)).join('')}
    <div class="section-title">🎵 曲目库</div>
    <button class="btn" style="width:100%;margin-bottom:10px" onclick="addPiece()">➕ 添加曲目</button>
    ${pieces.map((p,i)=>`<div class="list-item"><div class="li-icon">🎵</div><div class="li-info"><div class="li-title">${p.name}</div><div class="li-desc">${p.composer||''} · ${p.status}</div></div></div>`).join('')||'<div class="empty">暂无曲目</div>'}
    <div class="section-title">📋 最近练习</div>
    ${practice.slice(-10).reverse().map(p=>`<div class="list-item"><div class="li-icon">🎹</div><div class="li-info"><div class="li-title">${p.duration}分钟</div><div class="li-desc">${p.date} · ${p.piece||''}</div></div></div>`).join('')||'<div class="empty">暂无练习记录</div>'}
  `;
  return html;
}
function addPiano(){
  openModal('练习打卡',`
    <div class="form-row"><label>练习曲目</label><input id="pi-piece" placeholder="如：拜厄第1条"></div>
    <div class="form-row"><label>时长（分钟）</label><input id="pi-dur" type="number" placeholder="如 30"></div>
    <div class="form-row"><label>感受</label><textarea id="pi-note" placeholder="今日练习感受"></textarea></div>
    <button class="btn" style="width:100%" onclick="savePiano()">打卡</button>
  `);
}
function savePiano(){
  const p=getStore('hub_piano',[]);
  p.push({date:todayKey(),piece:$('#pi-piece').value,duration:parseInt($('#pi-dur').value)||0,note:$('#pi-note').value});
  setStore('hub_piano',p);closeModal();renderMod('piano');
}
function addPiece(){
  openModal('添加曲目',`
    <div class="form-row"><label>曲名</label><input id="pp-name" placeholder="如：献给爱丽丝"></div>
    <div class="form-row"><label>作曲家</label><input id="pp-composer" placeholder="如：贝多芬"></div>
    <div class="form-row"><label>状态</label><select id="pp-status"><option value="learning">学习中</option><option value="mastered">已掌握</option><option value="reviewing">复习中</option></select></div>
    <button class="btn" style="width:100%" onclick="savePiece()">保存</button>
  `);
}
function savePiece(){
  const p=getStore('hub_piano_pieces',[]);
  p.unshift({name:$('#pp-name').value,composer:$('#pp-composer').value,status:$('#pp-status').value});
  setStore('hub_piano_pieces',p);closeModal();renderMod('piano');
}

// ==================== 通用视频卡片 ====================
function videoCard(bv,title){
  const src=`https://player.bilibili.com/player.html?bvid=${bv}&high_quality=1&autoplay=0`;
  const id='v_'+bv+Math.random().toString(36).slice(2,6);
  return `<div class="v-card"><div class="v-head"><div class="v-num">▶</div><div class="v-title">${title}</div></div><div class="v-wrap"><div class="v-ph" id="${id}" onclick="loadVid('${id}','${src}')"><div class="v-play">▶</div><div class="v-pt">点击播放</div></div></div></div>`;
}
function loadVid(id,src){
  const el=document.getElementById(id);
  if(el)el.parentElement.innerHTML=`<iframe src="${src}" scrolling="no" frameborder="0" framespacing="0" allowfullscreen="true" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"></iframe>`;
}

// ==================== 初始化 ====================
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
renderHome();
updateTodayTimerLabel();
</script>
</body>
</html>
